<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Vladyslav Potapenko — Full-Stack Software Engineer · Mowo Games">
  <defs>
    <style>
      .display { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; letter-spacing: -0.04em; }
      .ui { font-family: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace; letter-spacing: 0.06em; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
    <radialGradient id="glow" cx="82%" cy="18%" r="62%">
      <stop offset="0" stop-color="#CF1B64" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#CF1B64" stop-opacity=".08"/>
      <stop offset="1" stop-color="#CF1B64" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E8E8E8" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#111"/>
      <stop offset=".55" stop-color="#111" stop-opacity=".2"/>
      <stop offset="1" stop-color="#111" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#111111"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#fade)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- Mowo wordmark (brand paths from mowogames.com), large and faint as a backdrop -->
    <g transform="translate(700 92) scale(4.2)" opacity=".10">
      <path fill="#E8E8E8" d="M0 22V0h6.2l6.8 9.4L19.8 0H26v22h-5.6V9.6l-7.4 9.6-7.4-9.6V22z"/>
      <path fill="#E8E8E8" fill-rule="evenodd" d="M41 0c6.9 0 12.4 4.9 12.4 11S47.9 22 41 22 28.6 17.1 28.6 11 34.1 0 41 0zm0 5.4c-3.8 0-6.7 2.5-6.7 5.6s2.9 5.6 6.7 5.6 6.7-2.5 6.7-5.6-2.9-5.6-6.7-5.6z"/>
      <path fill="#CF1B64" d="M56 0v22h6.2l6.8-9.4 6.8 9.4H82V0h-5.6v12.4L69 2.8l-7.4 9.6V0z"/>
      <path fill="#CF1B64" fill-rule="evenodd" d="M97.6 0c6.9 0 12.4 4.9 12.4 11s-5.5 11-12.4 11-12.4-4.9-12.4-11S90.7 0 97.6 0zm0 5.4c-3.8 0-6.7 2.5-6.7 5.6s2.9 5.6 6.7 5.6 6.7-2.5 6.7-5.6-2.9-5.6-6.7-5.6z"/>
    </g>

    <!-- eyebrow, like the site's "Gaming studio" pill -->
    <g transform="translate(64 64)">
      <rect width="266" height="30" rx="15" fill="#CF1B64" fill-opacity=".16" stroke="#CF1B64" stroke-opacity=".5"/>
      <circle class="pulse" cx="18" cy="15" r="4" fill="#CF1B64"/>
      <text x="32" y="20" class="mono" font-size="12" font-weight="500" fill="#FF8AB6">FULL-STACK · GAME DEV · ENGINES</text>
    </g>

    <text x="62" y="168" class="display" font-size="64" fill="#E8E8E8">Hi, I'm <tspan fill="#CF1B64">Vladyslav</tspan></text>
    <text x="64" y="214" class="ui" font-size="22" fill="#A3A3A3">Building engines, launchers and multiplayer worlds.</text>

    <text x="64" y="282" class="mono" font-size="14" fill="#8F8F8F">
      <tspan fill="#CF1B64">❯</tspan> mowo games  ·  majestic games  ·  alt:v multiplayer<tspan class="caret" fill="#CF1B64"> ▍</tspan>
    </text>

    <rect x="0" y="336" width="1200" height="4" fill="#CF1B64"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="19.5" fill="none" stroke="#2E2E2E"/>
</svg>
